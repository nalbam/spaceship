<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spaceship</title>
  <link rel="icon" href="data:," />
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #000; height: 100%; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    #hud {
      position: fixed; inset: 0; pointer-events: none;
      font-family: 'Lucida Console', Monaco, monospace;
      user-select: none;
    }
    #crosshair {
      position: absolute; left: 50%; top: 50%; width: 6px; height: 6px;
      margin: -3px 0 0 -3px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      box-shadow: 0 0 4px rgba(0,0,0,0.8);
    }
    #prompt {
      position: absolute; left: 50%; top: 56%; transform: translateX(-50%);
      color: #ffe8c8; font-size: 15px; letter-spacing: 1px;
      text-shadow: 0 0 6px rgba(0,0,0,0.9), 0 1px 2px #000;
      background: rgba(10, 14, 18, 0.55); border: 1px solid rgba(255, 170, 80, 0.35);
      padding: 5px 14px; border-radius: 3px; display: none;
    }
    #status {
      position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
      color: #8de8dc; font-size: 13px; letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(0,0,0,0.9);
      background: rgba(8, 12, 16, 0.45); border: 1px solid rgba(70, 200, 185, 0.25);
      padding: 4px 16px; border-radius: 3px; white-space: nowrap;
    }
    #ammo {
      position: absolute; right: 28px; bottom: 26px;
      color: #ffb066; font-size: 14px; letter-spacing: 3px;
      text-shadow: 0 0 8px rgba(0,0,0,0.9);
      background: rgba(8, 12, 16, 0.45); border: 1px solid rgba(255, 170, 80, 0.25);
      padding: 4px 14px; border-radius: 3px; white-space: nowrap;
    }
    #ammo.empty { color: #ff5230; border-color: rgba(255, 82, 48, 0.45); }
    #message {
      position: fixed; z-index: 20; left: 50%; top: 40%; transform: translateX(-50%);
      color: #f4ead8; font-size: 22px; letter-spacing: 3px;
      text-shadow: 0 0 12px rgba(0,0,0,1);
      opacity: 0; transition: opacity 0.6s ease; white-space: nowrap;
    }
    #fade {
      position: fixed; inset: 0; background: #000; opacity: 0;
      transition: opacity 0.7s ease; pointer-events: none;
    }
    #start {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; background: rgba(4, 6, 9, 0.82);
      color: #d8d4cc; cursor: pointer; z-index: 10;
      font-family: 'Lucida Console', Monaco, monospace;
    }
    #start h1 { font-size: 26px; letter-spacing: 6px; margin: 0; color: #ffb066; font-weight: normal; }
    #start p { font-size: 13px; letter-spacing: 2px; color: #7fc9c0; margin: 0; }
    #start.hidden { display: none; }
    #start button, #start select {
      font: inherit; font-size: 13px; letter-spacing: 2px; color: #ffe8c8;
      background: rgba(18, 24, 30, 0.9); border: 1px solid rgba(255, 170, 80, 0.45);
      border-radius: 3px; padding: 8px 18px; cursor: pointer;
    }
    #start button:hover, #start select:hover { border-color: #ffb066; }
    #start :focus-visible { outline: 2px solid #7fe8dc; outline-offset: 2px; }
    #start .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    #start-main { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 0 16px; }
    #start.settings-open #start-main { display: none; }
    #settings {
      cursor: default; width: min(420px, calc(100vw - 32px)); box-sizing: border-box;
      max-height: calc(100vh - 32px); overflow-y: auto;
      background: rgba(10, 14, 18, 0.95); border: 1px solid rgba(255, 170, 80, 0.35);
      border-radius: 4px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px;
    }
    #settings[hidden] { display: none; }
    #settings h2 { margin: 0; font-size: 18px; letter-spacing: 5px; color: #ffb066; font-weight: normal; }
    #settings .row { display: flex; flex-direction: column; gap: 6px; }
    #settings label { font-size: 12px; letter-spacing: 2px; color: #7fc9c0; display: flex; justify-content: space-between; gap: 12px; }
    #settings output { color: #ffe8c8; }
    #settings input[type=range] { width: 100%; accent-color: #ffb066; }
    #settings .hint { font-size: 11px; color: #8a8f94; letter-spacing: 1px; margin: 0; }
    #settings-status { min-height: 1.2em; font-size: 12px; letter-spacing: 1px; margin: 0; color: #8de8dc; text-align: center; max-width: calc(100vw - 32px); }
    #settings-status.error { color: #ff8a66; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    <div id="crosshair"></div>
    <div id="prompt"></div>
    <div id="status">SHIP TIME 08:00 &middot; ENERGY 100%</div>
    <div id="ammo">CHARGE 12 / 12</div>
  </div>
  <div id="fade"></div>
  <div id="message"></div>
  <div id="start">
    <div id="start-main">
      <h1>VENTURE-CLASS LIGHT FREIGHTER</h1>
      <p id="start-hint">CLICK TO BOARD &mdash; WASD MOVE &middot; SHIFT RUN &middot; MOUSE LOOK &middot; SPACE JUMP &middot; E INTERACT</p>
      <p>RMB AIM &middot; LMB FIRE &middot; R RELOAD &middot; ESC PAUSE</p>
      <div class="actions">
        <button id="board" type="button">BOARD</button>
        <button id="open-settings" type="button" data-no-lock>SETTINGS</button>
      </div>
    </div>
    <section id="settings" data-no-lock hidden aria-labelledby="settings-title">
      <h2 id="settings-title">SETTINGS</h2>
      <div class="row">
        <label for="set-quality">GRAPHICS QUALITY</label>
        <select id="set-quality">
          <option value="high">HIGH &mdash; AO + BLOOM</option>
          <option value="medium">MEDIUM &mdash; LIGHTER AO + BLOOM</option>
          <option value="low">LOW &mdash; NO AO / BLOOM, 1&times; PIXELS</option>
        </select>
      </div>
      <div class="row">
        <label for="set-volume">VOLUME <output id="out-volume" for="set-volume">100%</output></label>
        <input id="set-volume" type="range" min="0" max="100" step="5" value="100" />
      </div>
      <div class="row">
        <label for="set-sensitivity">MOUSE SENSITIVITY <output id="out-sensitivity" for="set-sensitivity">1.00&times;</output></label>
        <input id="set-sensitivity" type="range" min="0.25" max="3" step="0.05" value="1" />
      </div>
      <p class="hint">Changes apply and save immediately.</p>
      <div class="actions">
        <button id="close-settings" type="button">BACK</button>
        <button id="resume-settings" type="button">BOARD</button>
      </div>
    </section>
    <p id="settings-status" role="status" aria-live="polite" data-no-lock></p>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
